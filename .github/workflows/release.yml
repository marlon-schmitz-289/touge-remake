name: Release

on:
  push:
    tags:
      - "v*"
  # baut nur (Artefakte am Run), veröffentlicht nichts
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  # Tools/publish.sh wie lokal; macOS braucht einen Mac (codesign, ditto), Windows/Linux baut Linux
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            rids: osx-arm64
          - os: ubuntu-latest
            rids: win-x64 linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Commit-Anzahl für die Version ohne Tag
          fetch-depth: 0

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      # Ohne texts/ (privates Repo): die Story zeigt Platzhalter, übersetzte Originaltexte kommen nie in ein öffentliches Paket
      - name: Pakete
        env:
          VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
        run: VERSION="${VERSION#v}" Tools/publish.sh ${{ matrix.rids }}

      - uses: actions/upload-artifact@v7
        with:
          name: packages-${{ matrix.os }}
          path: |
            out/dist/*.zip
            out/dist/*.tar.gz

  # erst wenn Tests und alle Pakete grün sind
  release:
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') }}
    needs: [test, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Tags für den Changelog
          fetch-depth: 0

      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      # Changelog: die Stichpunkte aller Commits seit dem letzten Tag
      - name: Changelog
        run: |
          prev=$(git describe --tags --abbrev=0 "$GITHUB_REF_NAME^" 2>/dev/null || true)
          git log ${prev:+$prev..}"$GITHUB_REF_NAME" --no-merges --format=%b | grep -E '^(- |  )' > notes.md || true
          printf '\nKeine Spieldaten enthalten: das Spiel braucht die eigene ISO (README).\n' >> notes.md

      - name: Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "Touge ${GITHUB_REF_NAME#v}" --notes-file notes.md
