name: CI

on:
  pull_request:
  workflow_dispatch:
  # Release ruft CI parallel zum Build auf
  workflow_call:

# CI liest nur
permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      # ohne ISO: Tests mit Spieldaten überspringen sich selbst
      - run: dotnet test InitialDRemake.slnx
