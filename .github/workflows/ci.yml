name: CI

on:
  pull_request:
  workflow_dispatch:
  # Release ruft CI parallel zum Build auf
  workflow_call:

# CI liest nur
permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      # Silk.NET findet im portablen Test-Build unter Linux die mitgelieferte OpenAL nicht (die RID-Pakete aus publish.sh schon): System-OpenAL
      - name: Linux-OpenAL
        if: runner.os == 'Linux'
        run: sudo apt-get install -y -qq libopenal1

      # ohne ISO: Tests mit Spieldaten überspringen sich selbst
      - run: dotnet test InitialDRemake.slnx
